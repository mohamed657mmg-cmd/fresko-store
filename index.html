
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRESKO | فريزكو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#176b43;--light:#eef7e9;--text:#203326;--muted:#718075}
body{font-family:Tahoma,Arial,sans-serif;background:#f7f9f5;color:var(--text);padding-bottom:80px}
header{background:var(--green);color:white;padding:16px 5%;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:25px;font-weight:bold;letter-spacing:1px}
.logo span{color:#c6f36a}
.cart-btn{background:white;color:var(--green);border:0;border-radius:25px;padding:10px 15px;font-weight:bold}
.hero{padding:28px 5%;background:linear-gradient(135deg,#e4f5d9,#f7f9f5)}
.hero h1{color:var(--green);font-size:25px;line-height:1.6;margin-bottom:8px}
.hero p{color:#526653;line-height:1.8}
.search{display:block;width:90%;max-width:600px;margin:18px auto;padding:14px;border:1px solid #dce5d8;border-radius:14px;font-size:16px;background:white;outline-color:var(--green)}
.category-tabs{display:flex;gap:10px;padding:0 5% 20px;overflow-x:auto}
.tab{white-space:nowrap;border:1px solid #d5e5d2;background:white;padding:11px 18px;border-radius:24px;color:var(--green);font-weight:bold}
.tab.active{background:var(--green);color:white}
.section-title{padding:0 5%;margin:5px 0 15px;font-size:21px}
.sub-title{padding:0 5%;margin:20px 0 12px;color:var(--green);font-size:17px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 4% 25px}
.product{background:white;border:1px solid #e8eee4;border-radius:17px;padding:12px;box-shadow:0 3px 12px #173d1408;min-width:0}
.emoji{display:flex;align-items:center;justify-content:center;height:95px;background:var(--light);border-radius:13px;font-size:48px;margin-bottom:10px}
.product h3{font-size:16px;min-height:25px;margin-bottom:5px}
.price{font-size:12px;color:var(--muted);margin-bottom:10px}
.quantity{display:flex;align-items:center;justify-content:center;gap:12px;margin:9px 0}
.qty-btn{width:34px;height:34px;border:0;border-radius:10px;background:var(--green);color:white;font-size:21px;font-weight:bold}
.qty-number{min-width:20px;text-align:center;font-weight:bold}
.add{width:100%;padding:9px;background:#e6f3df;color:var(--green);border:0;border-radius:10px;font-weight:bold}
.empty{grid-column:1/-1;text-align:center;padding:25px;color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:white;border-top:1px solid #e1e9df;display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}
.nav-item{border:0;background:transparent;color:#718075;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:55px}
.nav-item b{font-size:20px;font-weight:normal}
.nav-item.active{color:var(--green);font-weight:bold}
#cartPanel{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:12px}
.cart-content{background:white;max-width:500px;margin:25px auto;padding:20px;border-radius:18px;max-height:85vh;overflow:auto}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.close{border:0;background:#eee;border-radius:8px;padding:8px 12px}
.cart-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
.cart-name{flex:1;font-size:14px}
.cart-controls{display:flex;align-items:center;gap:8px}
.cart-controls button{width:28px;height:28px;border:0;border-radius:8px;background:var(--light);color:var(--green);font-size:18px}
.cart-note{margin-top:15px;padding:12px;background:#fff8df;border-radius:10px;color:#705d25;font-size:13px;line-height:1.7}
footer{text-align:center;padding:20px;color:#718075;font-size:12px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.hero h1{font-size:34px}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">FRESKO<span>.</span></div>
    <button class="cart-btn" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
  </div>
</header>

<section class="hero">
  <h1>خضار وفاكهة طازة لحد باب بيتك 🍃</h1>
  <p>اختار اللي محتاجه، وحدد الكمية، وفريزكو يوصّل لك الخير.</p>
</section>

<input class="search" id="search" type="search" placeholder="🔍 ابحث عن منتج..." oninput="renderProducts()">

<div class="category-tabs">
  <button class="tab active" onclick="setCategory('الكل',this)">الكل</button>
  <button class="tab" onclick="setCategory('خضار',this)">🥦 الخضار</button>
  <button class="tab" onclick="setCategory('فاكهة',this)">🍎 الفاكهة</button>
</div>

<h2 class="section-title" id="sectionTitle">كل المنتجات</h2>
<div id="products"></div>

<footer>FRESKO | فريزكو · طازة لحد باب بيتك 🍃</footer>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="goHome(this)"><b>⌂</b>الرئيسية</button>
  <button class="nav-item" onclick="showCategory('خضار',this)"><b>🥦</b>الخضار</button>
  <button class="nav-item" onclick="showCategory('فاكهة',this)"><b>🍎</b>الفاكهة</button>
  <button class="nav-item" onclick="openCart(this)"><b>🛒</b>السلة</button>
  <button class="nav-item" onclick="accountInfo(this)"><b>👤</b>حسابي</button>
</nav>

<div id="cartPanel" onclick="closeCart(event)">
  <div class="cart-content" onclick="event.stopPropagation()">
    <div class="cart-head">
      <h2>🛒 سلة مشترياتك</h2>
      <button class="close" onclick="hideCart()">إغلاق ✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-note">أسعار المنتجات والتوصيل هتتحدد من المحل. السلة دي حاليًا نموذج واجهة، ولسه مش بتبعت طلب حقيقي.</div>
  </div>
</div>

<script>
const products = [
  // الخضار الأساسي
  ["طماطم","🍅","خضار","أساسي"],["خيار","🥒","خضار","أساسي"],
  ["بطاطس","🥔","خضار","أساسي"],["بصل أحمر","🧅","خضار","أساسي"],
  ["بصل أبيض","🧅","خضار","أساسي"],["بصل أخضر","🌱","خضار","أساسي"],
  ["ثوم","🧄","خضار","أساسي"],["جزر","🥕","خضار","أساسي"],
  ["فلفل رومي","🫑","خضار","أساسي"],["فلفل حامي","🌶️","خضار","أساسي"],
  ["فلفل ألوان","🫑","خضار","أساسي"],["باذنجان رومي","🍆","خضار","أساسي"],
  ["باذنجان عروس","🍆","خضار","أساسي"],["باذنجان أبيض","🍆","خضار","أساسي"],
  ["كوسة","🥒","خضار","أساسي"],["ملوخية","🌿","خضار","أساسي"],
  ["بامية","🌿","خضار","أساسي"],["فاصوليا خضراء","🫛","خضار","أساسي"],
  ["بسلة","🫛","خضار","أساسي"],["سبانخ","🥬","خضار","أساسي"],
  ["قلقاس","🥔","خضار","أساسي"],["بطاطا","🍠","خضار","أساسي"],

  // الورقيات والسلطة
  ["خس بلدي","🥬","خضار","ورقيات وسلطة"],["خس كابوتشي","🥬","خضار","ورقيات وسلطة"],
  ["كابوتشا","🥬","خضار","ورقيات وسلطة"],["جرجير","🌿","خضار","ورقيات وسلطة"],
  ["بقدونس","🌿","خضار","ورقيات وسلطة"],["كزبرة","🌿","خضار","ورقيات وسلطة"],
  ["شبت","🌿","خضار","ورقيات وسلطة"],["نعناع","🌿","خضار","ورقيات وسلطة"],
  ["كرفس","🌿","خضار","ورقيات وسلطة"],["كرنب بلدي","🥬","خضار","ورقيات وسلطة"],
  ["كرنب أحمر","🥬","خضار","ورقيات وسلطة"],["قرنبيط","🥦","خضار","ورقيات وسلطة"],
  ["بروكلي","🥦","خضار","ورقيات وسلطة"],["فجل أحمر","🌱","خضار","ورقيات وسلطة"],
  ["فجل أبيض","🌱","خضار","ورقيات وسلطة"],

  // خضار مميز
  ["مشروم","🍄","خضار","أصناف مميزة"],["ذرة حلوة","🌽","خضار","أصناف مميزة"],
  ["خرشوف","🌿","خضار","أصناف مميزة"],["بنجر","🫜","خضار","أصناف مميزة"],
  ["لفت","🫜","خضار","أصناف مميزة"],["خس آيسبرج","🥬","خضار","أصناف مميزة"],
  ["روكا","🌿","خضار","أصناف مميزة"],["أفوكادو","🥑","خضار","أصناف مميزة"],

  // فاكهة أساسية
  ["تفاح أحمر","🍎","فاكهة","أساسية"],["تفاح أصفر","🍏","فاكهة","أساسية"],
  ["تفاح أخضر","🍏","فاكهة","أساسية"],["موز بلدي","🍌","فاكهة","أساسية"],
  ["موز مستورد","🍌","فاكهة","أساسية"],["برتقال بلدي","🍊","فاكهة","أساسية"],
  ["برتقال سكري","🍊","فاكهة","أساسية"],["برتقال أبو سرة","🍊","فاكهة","أساسية"],
  ["يوسفي","🍊","فاكهة","أساسية"],["ليمون بلدي","🍋","فاكهة","أساسية"],
  ["ليمون أضاليا","🍋","فاكهة","أساسية"],["جوافة","🍐","فاكهة","أساسية"],
  ["كيوي","🥝","فاكهة","أساسية"],["فراولة","🍓","فاكهة","أساسية"],

  // فاكهة موسمية
  ["مانجا عويسي","🥭","فاكهة","موسمية"],["مانجا زبدية","🥭","فاكهة","موسمية"],
  ["مانجا سكري","🥭","فاكهة","موسمية"],["مانجا فص","🥭","فاكهة","موسمية"],
  ["مانجا نعومي","🥭","فاكهة","موسمية"],["بطيخ","🍉","فاكهة","موسمية"],
  ["شمام","🍈","فاكهة","موسمية"],["كنتالوب","🍈","فاكهة","موسمية"],
  ["عنب أحمر","🍇","فاكهة","موسمية"],["عنب أخضر","🍇","فاكهة","موسمية"],
  ["عنب أسود","🍇","فاكهة","موسمية"],["خوخ","🍑","فاكهة","موسمية"],
  ["برقوق","🟣","فاكهة","موسمية"],["مشمش","🍑","فاكهة","موسمية"],
  ["تين برشومي","🟣","فاكهة","موسمية"],["تين شوكي","🌵","فاكهة","موسمية"],
  ["رمان","🔴","فاكهة","موسمية"],["بلح زغلول","🌴","فاكهة","موسمية"],
  ["بلح سماني","🌴","فاكهة","موسمية"],["بلح بارحي","🌴","فاكهة","موسمية"],
  ["تمر","🌴","فاكهة","موسمية"],["أناناس","🍍","فاكهة","موسمية"],
  ["قشطة","🍈","فاكهة","موسمية"],["حرنكش","🟡","فاكهة","موسمية"],
  ["بشملة","🍊","فاكهة","موسمية"],["دوم","🌰","فاكهة","موسمية"],

  // فاكهة مستوردة
  ["دراجون فروت","🐉","فاكهة","مستوردة"],["بلوبيري","🫐","فاكهة","مستوردة"],
  ["راسبيري","🍓","فاكهة","مستوردة"],["كريز","🍒","فاكهة","مستوردة"],
  ["بابايا","🥭","فاكهة","مستوردة"],["جوز هند","🥥","فاكهة","مستوردة"]
].map((p,i)=>({id:i+1,name:p[0],emoji:p[1],category:p[2],group:p[3]}));

let selectedCategory="الكل";
let quantities={};
let cart={};

function setCategory(category,button){
  selectedCategory=category;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  if(button)button.classList.add("active");
  document.getElementById("sectionTitle").textContent=
    category==="الكل"?"كل المنتجات":category==="خضار"?"قسم الخضار":"قسم الفاكهة";
  renderProducts();
}
function showCategory(category,nav){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  nav.classList.add("active");
  const tabs=[...document.querySelectorAll(".tab")];
  const tab=tabs.find(b=>b.textContent.includes(category));
  setCategory(category,tab);
  window.scrollTo({top:0,behavior:"smooth"});
}
function goHome(nav){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  nav.classList.add("active");
  setCategory("الكل",document.querySelector(".tab"));
  window.scrollTo({top:0,behavior:"smooth"});
}
function changeQty(id,delta){
  quantities[id]=Math.max(0,(quantities[id]||0)+delta);
  renderProducts();
}
function addSelected(id){
  const q=quantities[id]||0;
  if(q<1){alert("اختار الكمية الأول من زر +");return;}
  cart[id]=(cart[id]||0)+q;
  quantities[id]=0;
  updateCart();
  renderProducts();
}
function renderProducts(){
  const search=document.getElementById("search").value.trim();
  const filtered=products.filter(p=>
    (selectedCategory==="الكل"||p.category===selectedCategory)&&p.name.includes(search)
  );
  const groups={};
  filtered.forEach(p=>{
    (groups[p.group]??=[]).push(p);
  });
  const container=document.getElementById("products");
  if(!filtered.length){container.innerHTML='<div class="empty">مش لاقيين المنتج ده في القائمة.</div>';return;}
  container.innerHTML=Object.entries(groups).map(([group,items])=>`
    <h3 class="sub-title">${group}</h3>
    <div class="products">
      ${items.map(p=>`
        <article class="product">
          <div class="emoji">${p.emoji}</div>
          <h3>${p.name}</h3>
          <div class="price">السعر يحدده المحل · وحدة البيع تُحدد لاحقًا</div>
          <div class="quantity">
            <button class="qty-btn" aria-label="زيادة" onclick="changeQty(${p.id},1)">+</button>
            <span class="qty-number">${quantities[p.id]||0}</span>
            <button class="qty-btn" aria-label="نقصان" onclick="changeQty(${p.id},-1)">−</button>
          </div>
          <button class="add" onclick="addSelected(${p.id})">أضف الكمية للسلة</button>
        </article>`).join("")}
    </div>`).join("");
}
function updateCart(){
  const count=Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById("cartCount").textContent=count;
  const entries=products.filter(p=>cart[p.id]>0);
  document.getElementById("cartItems").innerHTML=entries.length?entries.map(p=>`
    <div class="cart-row">
      <span class="cart-name">${p.emoji} ${p.name}</span>
      <div class="cart-controls">
        <button onclick="cartChange(${p.id},1)">+</button>
        <strong>${cart[p.id]}</strong>
        <button onclick="cartChange(${p.id},-1)">−</button>
      </div>
    </div>`).join(""):"<p>السلة لسه فاضية.</p>";
}
function cartChange(id,delta){
  cart[id]=Math.max(0,(cart[id]||0)+delta);
  if(!cart[id])delete cart[id];
  updateCart();
}
function openCart(){
  document.getElementById("cartPanel").style.display="block";
  updateCart();
}
function hideCart(){document.getElementById("cartPanel").style.display="none";}
function closeCart(e){if(e.target.id==="cartPanel")hideCart();}
function accountInfo(){
  alert("حساب العميل وتسجيل الدخول هيتضافوا بعد ربط التطبيق بقاعدة بيانات.");
}
renderProducts();
updateCart();
</script>
</body>
  </html>
